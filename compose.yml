version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ideas_recommendation
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ideas_recommendation"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  flaskapp2:
    build:
      context: ./backend
      dockerfile: flask.dockerfile
    image: flaskapp:1.0.0
    env_file:
      - ./backend/.env
    environment:
      # Si ya está en .env, puedes quitar esta línea:
      DATABASE_URL: postgresql+psycopg2://postgres:password@db:5432/ideas_recommendation
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      AZURE_STORAGE_CONTAINER: "images"
      PUBLIC_BLOB_BASE_URL: "http://localhost:10000/devstoreaccount1"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  angularapp2:
    build:
      context: ./frontend
      dockerfile: angular.dockerfile
    image: angularapp:1.0.0
    ports:
      - "3000:80"
    depends_on:
      - flaskapp2
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  azurite_data:

  
  

    

