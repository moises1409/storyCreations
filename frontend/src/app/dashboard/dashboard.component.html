<app-nav></app-nav>
<app-header></app-header>
<div class="dashboard-container main-with-sidebar">
  <!--<h1>Children's Story Co‑Creator</h1>-->
  <div class="dashboard-content">

    <!-- Main area (cards list or story workspace) -->
    <main class="main">
      <app-add-credits-modal *ngIf="showAddCredits" (closeModal)="closeAddCreditsModal()" (choosePlan)="onAddCredits($event)" [successMode]="creditsPurchased" [purchasedCredits]="purchasedCredits" [totalCredits]="totalCredits"></app-add-credits-modal>
      <!-- Seed view: question + CTA -->
      <ng-container *ngIf="phase==='seed'">
        <app-generate-story-widget (generate)="onGenerate($event)" [initialImages]="initialImagesFromNav" [initialSeed]="initialSeedFromNav" [initialLanguage]="initialLanguageFromNav" [initialCharacters]="initialCharactersFromNav"></app-generate-story-widget>

        <!-- Recent creations section (full width) -->
        <section class="recent-section">
          <h2 class="section-title" style="margin:0.25rem 0 0.5rem;">Recent creations</h2>
          <div class="filters-row" style="display:flex; justify-content: space-between; align-items:center; margin:0.25rem 0 0.75rem;">
            <div class="filters" style="display:flex; gap:0.5rem;">
              <button class="small" [class.selected]="filter==='all'" (click)="setFilter('all')">All</button>
              <button class="small" [class.selected]="filter==='in_progress'" (click)="setFilter('in_progress')">In progress</button>
              <button class="small" [class.selected]="filter==='finished'" (click)="setFilter('finished')">Finished</button>
            </div>
            <a routerLink="/creations" class="right-link">My creations ▸</a>
          </div>
          <div *ngIf="storiesLoading" style="display:flex; justify-content:center; padding: 1rem 0;">
            <div class="spinner"></div>
          </div>
          <app-story-cards *ngIf="!storiesLoading" [stories]="filteredStories" [limit]="4" (storyDeleted)="loadStories()"></app-story-cards>
        </section>
      </ng-container>
      

      

      
      

    </main>
  </div>
</div>
