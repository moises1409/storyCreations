<app-nav></app-nav>
<app-header></app-header>
<div class="dashboard-container main-with-sidebar">
  <!--<h1>Children's Story Co‑Creator</h1>-->
  <div class="dashboard-content">
    <main class="main">
      <app-add-credits-modal *ngIf="showAddCredits" (closeModal)="showAddCredits=false" (choosePlan)="onAddCredits($event)"></app-add-credits-modal>
      <!-- Seed phase -->
      <div *ngIf="mode==='new' && phase==='seed'" class="welcome-card start-card prompt-card">
        <div class="error" *ngIf="error" style="margin:0 0 0.5rem 0;">{{ error }}</div>
        <div class="prompt-area column">
          <textarea class="form-input big-input" rows="6" [formControl]="seedForm.controls.seed" placeholder="Give me a topic, premise and short instructions in any language"></textarea>
          <div class="prompt-actions">
            <button class="dashboard-btn" (click)="startWithSeed()" [disabled]="loading || seedForm.invalid">{{ loading ? 'Generating…' : 'Generate my story' }}</button>
          </div>
        </div>
        <div class="prompt-chips">
          <button class="small" (click)="seedForm.patchValue({seed:'A brave dragon in an enchanted forest'})">A brave dragon</button>
          <button class="small" (click)="seedForm.patchValue({seed:'An enchanted forest full of secrets'})">An enchanted forest</button>
          <button class="small" (click)="seedForm.patchValue({seed:'A space journey with new friends'})">A space journey</button>
        </div>
      </div>

      <!-- Loading chapters for existing stories -->
      <div *ngIf="loading && mode==='existing'" style="display:flex; justify-content:center; padding: 1.25rem 0;">
        <div class="spinner"></div>
      </div>

      <!-- Chapters list -->
      <div *ngIf="phase==='chapter' && chapters.length && !(loading && mode==='existing')">
        <div *ngFor="let c of chapters; index as i" style="margin-bottom: 1rem;">
          <div class="welcome-card chapter-card">
            <div style="grid-column: 1 / -1; display:flex; justify-content: space-between; align-items:center; margin-bottom:0.5rem;">
              <div class="meta"><div class="title">Chapter {{ i + 1 }}</div></div>
              <button class="small" (click)="c.collapsed = !c.collapsed">{{ c.collapsed ? 'Expand' : 'Collapse' }}</button>
            </div>
            <div class="chapter-left">
              <h2 class="chapter-title">{{ c.title }}</h2>
              <div *ngIf="!c.collapsed" style="min-height: 3.5rem; position: relative;">
                <ng-container *ngIf="loadingTextIndex === i; else textBlock">
                  <div class="spinner" style="position:absolute; left:0; top:0;"></div>
                </ng-container>
                <ng-template #textBlock>
                  <p class="scene-text">{{ c.text }}</p>
                </ng-template>
              </div>
              <div *ngIf="!c.collapsed" style="display:flex; gap:0.5rem; margin-top:0.75rem; flex-wrap:wrap; align-items:center;">
                <button class="small" (click)="playAudio(c, i)">
                  {{ (activeNarrationChapterIndex===i && narrationState!=='idle') ? (narrationState==='paused' ? 'Resume' : 'Restart') : 'Listen narration' }}
                </button>
                <ng-container *ngIf="activeNarrationChapterIndex===i && narrationState!=='idle'">
                  <button class="small" *ngIf="narrationState==='playing'" (click)="pauseNarration()">Pause</button>
                  <button class="small" *ngIf="narrationState==='paused'" (click)="resumeNarration()">Play</button>
                  <button class="small danger" (click)="stopNarration()">Stop</button>
                </ng-container>
              </div>
            </div>
            <div class="chapter-right">
              <div *ngIf="!c.collapsed" class="thumb image-slot" style="height:400px; width:100%; overflow:hidden; display:flex; align-items:center; justify-content:center; position:relative;">
                <ng-container *ngIf="loadingImageIndex === i; else imgBlock">
                  <div class="spinner"></div>
                </ng-container>
                <ng-template #imgBlock>
                  <img [src]="c.imageUrl || '/assets/test.jpeg'" alt="chapter image" style="width:100%; height:100%; object-fit:cover; border-radius:8px;"/>
                </ng-template>
              </div>
            </div>
          </div>

          <!-- Continuation block for the latest chapter only -->
          <div *ngIf="i === chapters.length - 1 && finalReadyForIndex === null && loadingTextIndex !== i && loadingImageIndex !== i && storyStatus==='in_progress'" class="chapter-continue">
            <div class="error" *ngIf="error" style="margin-bottom:0.5rem;">{{ error }}</div>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:1rem; margin-bottom:0.75rem;">
              <button class="small" *ngFor="let opt of (c?.choices || [])" (click)="onChoice(opt)">{{ opt }}</button>
            </div>
            <div class="prompt-area column">
              <textarea class="form-input" rows="3" [formControl]="userContinuation" placeholder="Write your own continuation..." (input)="onUserTextInput()"></textarea>
              <div class="prompt-actions">
                <button class="small" (click)="finalizeStory()" [disabled]="loading || !hasText()">Finish story</button>
                <button class="dashboard-btn" *ngIf="chapters.length < maxChapters - 1" (click)="generateNextChapter()" [disabled]="loading || !hasText()">Generate next chapter</button>
                <button class="small" *ngIf="error" (click)="showAddCredits=true">Add credits</button>
              </div>
            </div>
          </div>

          <!-- Final export block -->
          <div *ngIf="finalReadyForIndex === i && !loadingTextIndex && !loadingImageIndex" class="welcome-card" style="margin-top:0.75rem;">
            <h2 class="section-title">Story complete!</h2>
            <p class="meta">{{ historyTitle }} · {{ chapters.length }} chapters</p>
            <div style="display:flex; gap:0.75rem; flex-wrap:wrap; margin-top:1rem;">
              <button class="small" (click)="exportPdf()">📖 Generate PDF</button>
              <button class="small" (click)="exportVideo()">🎬 Generate video</button>
              <button class="small" (click)="saveStory()">💾 Save to My Stories</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
